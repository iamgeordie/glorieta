<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* LinguaMama Studio "road" theme tokens (studio-core compose.ts) and Glorieta's dark figure palette. */
      :root {
        --bg: #14202c; --panel: #20303f; --fg: #ffffff; --muted: #c6d3df; --accent: #f5b942;
        --yes: #7fe0a0; --no: #ff9a9a;
        --grass: #18241c; --island: #243a2b; --road: #2e353f; --curb: #5d6672; --line: #e9ebef;
        --me: #5b9bff; --other: #f0a24a; --danger: #ff6b6b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1280px; height: 720px; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
      #heading { position: absolute; left: 64px; top: 34px; font-size: 40px; font-weight: 700; color: var(--accent); letter-spacing: -0.02em; }
      #stage { position: absolute; left: 64px; top: 100px; width: 460px; height: 460px; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 3px var(--panel); }
      #stage svg { width: 460px; height: 460px; display: block; }
      .card { position: absolute; left: 580px; width: 620px; height: 112px; background: var(--panel); border-radius: 18px; display: flex; align-items: center; gap: 22px; padding: 0 26px; font-size: 28px; font-weight: 700; }
      .card .ico { width: 78px; height: 78px; flex: none; display: flex; align-items: center; justify-content: center; }
      .card .mark { margin-left: auto; font-size: 38px; }
      #c-sign { top: 100px; } #c-other { top: 232px; } #c-me { top: 364px; }
      .yes { color: var(--yes); } .no { color: var(--no); }
      .tagline { font-weight: 400; color: var(--muted); font-size: 22px; display: block; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1280" data-height="720">
      <div id="heading" class="clip" data-start="0" data-duration="12" data-track-index="0"><span id="heading-in">Prioridad a la derecha</span></div>

      <div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <svg id="junction" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f5b942"/></marker>
            <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe9a3" stop-opacity=".45"/><stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/></linearGradient>
            <g id="car-body">
              <rect x="-12.6" y="-8.5" width="3.4" height="3" rx="1" fill="currentColor"/>
              <rect x="9.2" y="-8.5" width="3.4" height="3" rx="1" fill="currentColor"/>
              <path d="M-7 -20.5 Q0 -22 7 -20.5 Q10 -19.6 10 -15 L10 15 Q10 20 6 20.5 L-6 20.5 Q-10 20 -10 15 L-10 -15 Q-10 -19.6 -7 -20.5 Z" fill="currentColor"/>
              <path d="M-8.2 -9.5 Q0 -12 8.2 -9.5 L6.8 -2.5 Q0 -3.6 -6.8 -2.5 Z" fill="#16202b"/>
              <path d="M-6.6 -9.6 Q0 -11.2 3 -10.9" stroke="#fff" stroke-width=".9" opacity=".45" fill="none"/>
              <path d="M-6.6 11 Q0 10 6.6 11 L7.4 15.4 Q0 14.6 -7.4 15.4 Z" fill="#16202b" opacity=".85"/>
              <rect x="-8.8" y="-20.2" width="5.2" height="2.6" rx="1.2" fill="#fff6c8"/>
              <rect x="3.6" y="-20.2" width="5.2" height="2.6" rx="1.2" fill="#fff6c8"/>
              <rect x="-8.6" y="18.2" width="4.6" height="2" rx="1" fill="#ff4d4d"/>
              <rect x="4" y="18.2" width="4.6" height="2" rx="1" fill="#ff4d4d"/>
            </g>
            <g id="car"><path d="M-8 -20 L-13 -40 L13 -40 L8 -20 Z" fill="url(#beam)"/><use href="#car-body"/></g>
          </defs>
          <rect width="360" height="360" fill="#18241c"/>
          <g id="blocks">
            <rect x="-12" y="-12" width="162" height="162" rx="8" fill="#5d6672"/><rect x="-12" y="-12" width="156" height="156" rx="5" fill="#243a2b"/>
            <rect x="210" y="-12" width="162" height="162" rx="8" fill="#5d6672"/><rect x="216" y="-12" width="156" height="156" rx="5" fill="#243a2b"/>
            <rect x="-12" y="210" width="162" height="162" rx="8" fill="#5d6672"/><rect x="-12" y="216" width="156" height="156" rx="5" fill="#243a2b"/>
            <rect x="210" y="210" width="162" height="162" rx="8" fill="#5d6672"/><rect x="216" y="216" width="156" height="156" rx="5" fill="#243a2b"/>
          </g>
          <g id="roads" fill="#2e353f"><rect x="150" y="-10" width="60" height="380"/><rect x="-10" y="150" width="380" height="60"/></g>
          <path id="dashes" d="M180 0 V132 M180 228 V360 M0 180 H132 M228 180 H360" stroke="#e9ebef" stroke-width="2.5" stroke-dasharray="10 8" fill="none"/>
          <rect id="stopbar" x="183" y="226" width="24" height="4" rx="2" fill="#ff6b6b" opacity="0"/>
          <polygon id="look" points="200,232 372,138 372,214" fill="#f5b942" opacity="0"/>
          <line id="path-a" x1="300" y1="165" x2="300" y2="165" stroke="#f5b942" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)" opacity="0"/>
          <image id="sign" href="assets/p-2.svg" x="222" y="292" width="46" height="41" opacity="0"/>
          <g id="car-a"><g transform="rotate(-90)"><path id="beam-a" d="M-8 -20 L-13 -40 L13 -40 L8 -20 Z" fill="url(#beam)" opacity="0"/><use href="#car-body" style="color:#f0a24a"/></g></g>
          <g id="car-b"><path id="beam-b" d="M-8 -20 L-13 -40 L13 -40 L8 -20 Z" fill="url(#beam)" opacity="0"/><use href="#car-body" style="color:#5b9bff"/></g>
          <circle id="ring" cx="195" cy="250" r="26" fill="none" stroke="#ff6b6b" stroke-width="3" opacity="0"/>
        </svg>
      </div>

      <div id="c-sign" class="card clip" data-start="0" data-duration="12" data-track-index="2">
        <div class="ico"><img src="assets/p-2.svg" style="width:78px"></div>
        <div>Intersección con prioridad de la derecha</div>
      </div>
      <div id="c-other" class="card clip" data-start="0" data-duration="12" data-track-index="3">
        <div class="ico"><svg viewBox="-42 -42 84 84" width="78" height="78"><use href="#car-body" style="color:#f0a24a" transform="rotate(-90) scale(1.6)"/></svg></div>
        <div>Viene por la derecha<span class="tagline">pasa primero</span></div>
        <div class="mark yes">✓</div>
      </div>
      <div id="c-me" class="card clip" data-start="0" data-duration="12" data-track-index="4">
        <div class="ico"><svg viewBox="-42 -42 84 84" width="78" height="78"><use href="#car-body" style="color:#5b9bff" transform="scale(1.6)"/></svg></div>
        <div>Tú<span class="tagline">esperas y miras a la derecha</span></div>
        <div class="mark no">✕</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // 0.0 heading, junction builds
      tl.fromTo("#heading-in", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#blocks", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.1);
      tl.fromTo("#roads", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.25);
      tl.fromTo("#dashes", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.5);
      tl.set("#car-a", { x: 392, y: 165 }, 0);
      tl.set("#car-b", { x: 195, y: 392 }, 0);
      // 1.0 the sign: in the diagram and as a card
      tl.fromTo("#sign", { opacity: 0, scale: 0.4, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 1.0);
      tl.fromTo("#c-sign", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 1.1);
      // 2.0 you arrive and stop at the line
      tl.to("#car-b", { y: 250, duration: 1.6, ease: "power2.out" }, 2.0);
      tl.to("#stopbar", { opacity: 1, duration: 0.25 }, 3.3);
      tl.fromTo("#ring", { opacity: 0.9, attr: { r: 18 } }, { opacity: 0, attr: { r: 40 }, duration: 0.7, ease: "power1.out", immediateRender: false }, 3.5);
      // 3.8 a car comes from the right; you look right
      tl.to("#car-a", { x: 300, duration: 1.3, ease: "power2.out" }, 3.8);
      tl.to("#look", { opacity: 0.22, duration: 0.4 }, 4.1);
      tl.fromTo("#c-me", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 4.4);
      // 5.4 it has priority: its path draws, it crosses
      tl.fromTo("#c-other", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 5.4);
      tl.set("#path-a", { opacity: 1 }, 5.5);
      tl.to("#path-a", { attr: { x2: 52 }, duration: 0.7, ease: "power2.inOut" }, 5.5);
      tl.to("#car-a", { x: -40, duration: 2.0, ease: "power1.in" }, 6.3);
      tl.to("#path-a", { opacity: 0, duration: 0.4 }, 7.9);
      tl.to("#look", { opacity: 0, duration: 0.3 }, 7.6);
      // 8.6 now you go
      tl.to("#c-me .mark", { opacity: 0, duration: 0.2 }, 8.4);
      tl.to("#stopbar", { opacity: 0, duration: 0.3 }, 8.6);
      tl.to("#car-b", { y: -40, duration: 2.0, ease: "power1.in" }, 8.7);
      tl.to("#c-other", { opacity: 0.55, duration: 0.4 }, 9.0);
      // Headlight beams: lit only while each car moves (ease in after setting off, out before stopping).
      const beam = (id, from, to) => { tl.to(id, { opacity: 1, duration: 0.25 }, from); tl.to(id, { opacity: 0, duration: 0.25 }, to - 0.25); };
      beam("#beam-b", 2.0, 3.6); beam("#beam-a", 3.8, 5.1); beam("#beam-a", 6.3, 8.3); beam("#beam-b", 8.7, 10.7);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
