<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <marker id="f-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" />
    </marker>
    <!-- Top-down vehicles: front pointing up, centered on 0,0. Color comes from CSS (.f-me, .f-other, ...). -->
    <!-- The front reads from the windscreen set forward, headlights on the front corners, tail lights at the back and mirrors. -->
    <g id="v-car">
      <rect x="-12.6" y="-8.5" width="3.4" height="3" rx="1" fill="currentColor" />
      <rect x="9.2" y="-8.5" width="3.4" height="3" rx="1" fill="currentColor" />
      <path d="M-7 -20.5 Q0 -22 7 -20.5 Q10 -19.6 10 -15 L10 15 Q10 20 6 20.5 L-6 20.5 Q-10 20 -10 15 L-10 -15 Q-10 -19.6 -7 -20.5 Z" fill="currentColor" />
      <path d="M-8.2 -9.5 Q0 -12 8.2 -9.5 L6.8 -2.5 Q0 -3.6 -6.8 -2.5 Z" class="f-screen" />
      <path d="M-6.6 -9.6 Q0 -11.2 3 -10.9" class="f-glint" />
      <path d="M-6.6 11 Q0 10 6.6 11 L7.4 15.4 Q0 14.6 -7.4 15.4 Z" class="f-screen f-rear" />
      <rect x="-8.8" y="-20.2" width="5.2" height="2.6" rx="1.2" class="f-headlight" />
      <rect x="3.6" y="-20.2" width="5.2" height="2.6" rx="1.2" class="f-headlight" />
      <rect x="-8.6" y="18.2" width="4.6" height="2" rx="1" class="f-taillight" />
      <rect x="4" y="18.2" width="4.6" height="2" rx="1" class="f-taillight" />
    </g>
    <!-- Headlight beam, drawn ahead of a moving vehicle's front edge (y = 0 here). -->
    <linearGradient id="f-beam-fade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe9a3" stop-opacity="0.45" />
      <stop offset="1" stop-color="#ffe9a3" stop-opacity="0" />
    </linearGradient>
    <path id="v-beam" d="M-8 0 L-13 -20 L13 -20 L8 0 Z" fill="url(#f-beam-fade)" />
    <g id="v-truck">
      <rect x="-11" y="-36" width="22" height="72" rx="3" fill="currentColor" />
      <path d="M-8 -32 L8 -32 L8 -22 L-8 -22 Z" class="f-glass" />
      <path d="M-11 -18 L11 -18" class="f-seam" />
    </g>
    <g id="v-moto">
      <rect x="-3" y="-16" width="6" height="32" rx="3" fill="currentColor" />
      <rect x="-9" y="-10" width="18" height="3" rx="1.5" fill="currentColor" />
      <circle cx="0" cy="0" r="4.5" class="f-glass" />
    </g>
    <g id="v-bike">
      <rect x="-2" y="-15" width="4" height="30" rx="2" fill="currentColor" />
      <rect x="-6.5" y="-9" width="13" height="2.5" rx="1.2" fill="currentColor" />
      <circle cx="0" cy="1" r="4" class="f-glass" />
    </g>
    <g id="v-ped">
      <ellipse cx="0" cy="0" rx="8" ry="4.5" fill="currentColor" />
      <circle cx="0" cy="0" r="3.6" class="f-glass" />
    </g>
  </defs>
</svg>
